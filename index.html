<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FootFlash V21</title><style>body{margin:0;font-family:system-ui;background:#f4f7f6;color:#102018}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}.top{background:#102018;color:#fff;padding:22px}.logo{font-size:24px;font-weight:900}.pill{display:inline-block;background:#087443;color:#fff;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.section{padding:16px}.card{border:1px solid #e4e9e6;border-radius:16px;padding:14px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.score{font-size:22px;font-weight:900}.muted{color:#66746d;font-size:12px}.nav{position:sticky;bottom:0;background:#fff;border-top:1px solid #e4e9e6;display:flex;justify-content:space-around;padding:12px 4px;font-size:11px}.btn{border:0;border-radius:12px;padding:10px 13px;background:#102018;color:white;font-weight:800}.live{color:#b42318;font-weight:900}.empty{padding:25px;text-align:center;color:#66746d}</style><body><div class="app"><header class="top"><div class="logo">⚽ FootFlash</div><div class="muted" style="color:#c7d5ce">V21 · Football en direct</div></header><section class="section"><div class="row"><h2>🔴 Matchs live</h2><button class="btn" onclick="load()">↻</button></div><div id="status" class="muted">Connexion au serveur…</div><div id="matches"></div></section><nav class="nav"><span>⌂<br>Accueil</span><span><b>⚽<br>Matchs</b></span><span>📰<br>News</span><span>↔<br>Transferts</span><span>👤<br>Profil</span></nav></div><script>const API=localStorage.getItem('FOOTFLASH_API')||'';async function load(){const s=document.getElementById('status'),m=document.getElementById('matches');if(!API){s.textContent='Mode démo · URL du serveur non configurée';m.innerHTML='<div class="card"><div class="live">🔴 LIVE</div><div class="row"><b>Match de démonstration</b><span class="score">2–1</span></div><div class="muted">Configure l’URL du backend FootFlash pour recevoir les vrais matchs.</div></div>';return}try{const r=await fetch(API+'/api/matches/live');if(!r.ok)throw 0;const data=await r.json();s.textContent='Serveur connecté';m.innerHTML=data.length?data.map(x=>`<div class="card"><div class="muted">${x.competition||'Football'} · ${x.minute||0}'</div><div class="row"><b>${x.home}</b><span class="score">${x.home_score}–${x.away_score}</span><b>${x.away}</b></div><div class="live">${x.status}</div></div>`).join(''):'<div class="empty">Aucun match live actuellement.</div>'}catch(e){s.textContent='Serveur inaccessible';m.innerHTML='<div class="empty">Impossible de charger les matchs.</div>'}}load();</script></body></html>
